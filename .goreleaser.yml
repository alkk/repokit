version: 2

builds:
  - id: debrepo
    main: ./cmd/debrepo
    binary: debrepo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.revision={{.Tag}}-{{.ShortCommit}}-{{ trimsuffix (replace (replace .CommitDate "-" "") ":" "") "Z" }}

archives:
  - id: debrepo
    builds:
      - debrepo
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: debrepo
    package_name: debrepo
    builds:
      - debrepo
    vendor: netxms
    homepage: https://github.com/netxms/debrepo
    maintainer: netxms
    description: Minimalistic Debian apt repository manager backed by SQLite
    license: MIT
    formats:
      - deb
      - rpm
