version: 2

builds:
  - id: repokit
    main: ./cmd/repokit
    binary: repokit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.revision={{.Tag}}-{{.ShortCommit}}-{{ trimsuffix (replace (replace .CommitDate "-" "") ":" "") "Z" }}

archives:
  - id: repokit
    ids:
      - repokit
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

nfpms:
  - id: repokit
    package_name: repokit
    ids:
      - repokit
    vendor: alkk
    homepage: https://github.com/alkk/repokit
    maintainer: netxms
    description: Minimalistic Debian apt repository manager backed by SQLite
    license: MIT
    formats:
      - deb
      - rpm
